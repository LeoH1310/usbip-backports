name: on-push

on: [push]

jobs:
  build:
    runs-on: [ubuntu-24.04]
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install build-essential linux-headers-generic
    - name: Build
      run: |
        set -- /usr/src/linux-headers-*-generic
        make KDIR="$1"
        sudo make KDIR="$1" install
